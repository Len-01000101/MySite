<html>
    <head>
        <style>
            * 
            {
                margin: 0; box-sizing: border-box;
            }

            body
            {
                background: #0a0a0a; min-height: 100vh; color: #fff; font-family: monospace;
            }

            .pixel-bg 
            {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: -1;
            }

            .cell
            {
                height: 12px;
                width: 12px;
                background: rgba(168, 85, 247, 0);
            }

            .glow
            {
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%), rgba(168, 85, 247, 0.4), transparent 70%);
                mix-blend-mode: screen;
            }

            #grid
            {
                display: grid;
                grid-template-columns: repeat(auto-fill, 12px);
                grid-template-rows: repeat(auto-fill, 12px);
                gap: 1px;
            }
        </style>
    </head>
    <body>
        <script>
            const texts = 
            [
                "Everett's site",
                "Ellie's site",
            ];
            const randomIndex = Math.floor(Math.random() * 2);
            document.getElementById('random-text').textContent = texts[randomIndex];
        </script>   
        <h1 id='random-text'>Hello!</h1>
        <h2>
            About me:
        </h2>
        <p>
            Hello! my name is Everett, I'm 15, and I'm a sophomore at Cedar Falls High School.<br>
            There's a lot to unpack into so let's get started<br><br>
            Names: Everett/ Ellie (Any/ All)<br>
            DoB: 04/27/2011 (15 y.o.)
            Identity:
            <ul>
                <li>MLM (Gay)</li>
                <li>Genderfluid</li>
                <li>Femboy</li>
           </ul>
        </p>
    </body>

    <div class="pixel-bg">
        <div class="glow"></div>
        <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill, 12px);grid-template-rows:repeat(auto-fill, 12px);gap:1px;"></div>
    </div>
    <script>
        const grid = document.getElementById('grid');
        const colums = getComputedStyle(grid).gridTemplateColumns.split(' ').length;   
        const lines = Math.ceil((innerHeight + 1) / 13);
        const cells = [];
        
        for (let i = 0; i < colums * lines; i++)
        {
            const l = document.createElement('div');
            l.className = 'cell';
            grid.appendChild(l);
            cells.push(l);
        }

        addEventListener('mousemove', e =>
        {
            document.documentElement.style.setProperty('--mx', e.clientX + 'px');
            document.documentElement.style.setProperty('--my', e.clientY + 'px');
            
            const l = 100;
            for(let i = 0; i < cells.length; i++)
            {
                const c = i % colums, r = Math.floor(i / colums);
                const distance = Math.sqrt(Math.pow(c * 13 + 6 - e.clientX, 2) + Math.pow(r * 13 + 6 - e.clientY, 2))
                cells[i].style.background = distance < l ? `rgba(168, 85, 247, ${1 - distance / l})` : '';
            }
        });
    </script>
</html>
