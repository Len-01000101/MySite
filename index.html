    <html>
    <head>
        <title>
            Elvrett :3
        </title>
        <style>
            * 
            {
                margin: 0; box-sizing: border-box;
            }

            body
            {
                background: #0a0a0a; min-height: 100vh; color: #fff; font-family: monospace;
                font-size: 1.3em;
            }

            .pixel-bg 
            {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: -1;
            }

            .cell
            {
                height: 12px;
                width: 12px;
                background: rgba(168, 85, 247, 0);
            }

            .glow
            {
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%), rgba(168, 85, 247, 0.4), transparent 70%);
                mix-blend-mode: screen;
            }

            #grid
            {
                display: grid;
                grid-template-columns: repeat(auto-fill, 12px);
                grid-template-rows: repeat(auto-fill, 12px);
                gap: 1px;
            }
        </style>
    </head>
    <body>
        <h1 id='random-text'></h1><h1>'s site</h1>
        <script>
            const texts = 
            [
                "Everett",
                "Ellie",
            ];
            const randomIndex = Math.floor(Math.random() * 2);
            document.getElementById('random-text').textContent = texts[randomIndex];
        </script> 
        
        <style>
            .dottie 
            {
                position: relative;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #22c55e;
            }

            .dottie::after 
            {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: 50%;
                background: inherit;
                animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
            }

            @keyframes ping 
            {
                75%, 100% 
                {
                    scale: 2.4;
                    opacity: 0;
                }
            }   
        </style>
        <span class="dottie" aria-label="Online"></span>Actively online thinking about something stupid
        <br><br>
        <p id='random-greeting'></p>
        , I'm <p id='random-text'></p><br>
        <script>
            const texts = 
            [
                "Everett",
                "Ellie",
            ];
            const randomIndex = Math.floor(Math.random() * 2);
            document.getElementById('random-text').textContent = texts[randomIndex];
        </script>
        <script>
            const texts = 
            [
                "Hello",
                "Hola",
                "Hallo",
                "привет",
                "Bonjour"
            ];
            const randomIndex = Math.floor(Math.random() * 5);
            document.getElementById('random-greeting').textContent = texts[randomIndex];
        </script>  
    </body>

    <div class="pixel-bg">
        <div class="glow"></div>
        <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill, 12px);grid-template-rows:repeat(auto-fill, 12px);gap:1px;"></div>
    </div>
    <script>
        const grid = document.getElementById('grid');
        const colums = getComputedStyle(grid).gridTemplateColumns.split(' ').length;   
        const lines = Math.ceil((innerHeight + 1) / 13);
        const cells = [];
        
        for (let i = 0; i < colums * lines; i++)
        {
            const l = document.createElement('div');
            l.className = 'cell';
            grid.appendChild(l);
            cells.push(l);
        }

        addEventListener('mousemove', e =>
        {
            document.documentElement.style.setProperty('--mx', e.clientX + 'px');
            document.documentElement.style.setProperty('--my', e.clientY + 'px');
            
            const l = 100;
            for(let i = 0; i < cells.length; i++)
            {
                const c = i % colums, r = Math.floor(i / colums);
                const distance = Math.sqrt(Math.pow(c * 13 + 6 - e.clientX, 2) + Math.pow(r * 13 + 6 - e.clientY, 2))
                cells[i].style.background = distance < l ? `rgba(168, 85, 247, ${1 - distance / l})` : '';
            }
        });
    </script>
</html>
